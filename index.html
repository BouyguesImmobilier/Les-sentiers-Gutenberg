<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guide pratique du logement - Les Sentiers Gutenberg</title>

  <style>
    body {
      margin: 0;
      font-family: "Avenir Next LT Pro", "Avenir Next", "Nunito Sans", Arial, sans-serif;
      background: #f7f9f8;
      color: #003B4A;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: white;
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0, 59, 74, 0.15);
      border-top: 12px solid #86BC24;
    }

    .logo {
      max-width: 280px;
      width: 80%;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 30px;
      line-height: 1.2;
      margin: 0 0 12px;
      color: #003B4A;
      font-weight: 700;
    }

    .subtitle {
      font-size: 18px;
      font-weight: 700;
      color: #86BC24;
      margin-bottom: 24px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    p {
      font-size: 16px;
      line-height: 1.5;
      margin: 0 0 28px;
      font-weight: 400;
    }

    .button {
      display: inline-block;
      background: #003B4A;
      color: white;
      text-decoration: none;
      padding: 16px 28px;
      border-radius: 999px;
      font-size: 17px;
      font-weight: 700;
    }

    .button:hover {
      background: #002d39;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <img 
        src="bi_logo_principal_rvb.png" 
        alt="Bouygues Immobilier" 
        class="logo"
      />

      <h1>Guide pratique du logement</h1>
      <div class="subtitle">Les Sentiers Gutenberg</div>

      <p>
        Bienvenue dans votre résidence.<br>
        Cliquez sur le bouton ci-dessous pour consulter le guide pratique de votre logement.
      </p>

      <a 
        class="button" 
        href="Guide%20pratique%20du%20logement%20-%20Les%20Sentiers%20Gutenberg.pdf" 
        target="_blank"
      >
        Ouvrir le guide
      </a>
    </section>
  </main>
</body>
</html>
